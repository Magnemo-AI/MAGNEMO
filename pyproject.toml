[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnemo"
version = "0.6.11.post1"
description = "Persistent Memory for AI agents, in plain local files. Nothing becomes Memory until you approve it. No network calls of its own."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "SVTech Inc. · Silver Valley Technologies"}]
# Zero runtime dependencies — house law. The server speaks MCP over stdio with
# the standard library only. Free tier: nothing here needs a paid service.
dependencies = []
keywords = ["memory", "ai-agents", "mcp", "mcp-server", "governance", "provenance", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://magnemo.ai"
Source = "https://github.com/magnemo-ai/magnemo"
Documentation = "https://magnemo.ai/manual"
Changelog = "https://github.com/magnemo-ai/magnemo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# THE SUBSCRIPTION SOCKET: the Claude Agent SDK signs in through your own Claude
# Code login (the sanctioned door). Optional — the engine itself stays zero-dep.
claude = ["claude-agent-sdk>=0.2"]

[project.scripts]
magnemo = "magnemo.cli:main"
magnemo-mcp = "magnemo.mcp:main"

[tool.setuptools]
packages = ["magnemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
